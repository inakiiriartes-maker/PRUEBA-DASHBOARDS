<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Viajes TravelPerk 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; }
  header { background: #fff; border-bottom: 1px solid #e5e5e3; padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 500; }
  header span { font-size: 13px; color: #888; }
  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem; }
  .filters { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  select { padding: 7px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; background: #fff; color: #1a1a1a; cursor: pointer; }
  select:focus { outline: none; border-color: #999; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .kpi { background: #fff; border-radius: 10px; padding: 1rem 1.25rem; border: 1px solid #ebebeb; }
  .kpi-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .kpi-value { font-size: 22px; font-weight: 500; }
  .kpi-sub { font-size: 12px; color: #aaa; margin-top: 4px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 1.5rem; }
  .charts-row3 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 1.5rem; }
  .card { background: #fff; border-radius: 10px; padding: 1.25rem; border: 1px solid #ebebeb; }
  .card h3 { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .card canvas { max-height: 220px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { font-size: 12px; color: #555; width: 130px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: #f0f0ee; border-radius: 4px; height: 8px; }
  .bar-fill { height: 8px; border-radius: 4px; background: #4f7cff; }
  .bar-amount { font-size: 12px; color: #555; width: 65px; text-align: right; flex-shrink: 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #ebebeb; color: #888; font-weight: 500; font-size: 12px; }
  td { padding: 8px 10px; border-bottom: 1px solid #f5f5f3; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 500; }
  .badge-route { background: #e8f0fe; color: #3b5ccc; }
  .badge-hotel { background: #fce8e6; color: #c0392b; }
  .badge-pro { background: #e6f4ea; color: #2e7d32; }
  .badge-other { background: #f3f3f0; color: #666; }
  .loading { text-align: center; padding: 4rem; color: #aaa; font-size: 15px; }
  @media (max-width: 700px) {
    .charts, .charts-row3 { grid-template-columns: 1fr; }
    .container { padding: 1rem; }
    header { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>✈️ Dashboard Viajes TravelPerk 2026</h1>
  <span id="last-update">Cargando datos...</span>
</header>

<div class="container">
  <div class="filters">
    <select id="filter-mes"><option value="">Todos los meses</option></select>
    <select id="filter-bu"><option value="">Todas las BU</option></select>
    <select id="filter-cruce"><option value="">Todos los cruces</option></select>
  </div>

  <div id="main-content" class="loading">Cargando datos desde CSV...</div>
</div>

<script>
const CSV_URL = 'travelperk.csv';
let allData = [];

const MONTHS_ORDER = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

function fmt(n) { return new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR', maximumFractionDigits:0}).format(n); }
function fmtDec(n) { return new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2}).format(n); }

function getTipo(summary) {
  if (!summary) return 'Otros';
  if (summary.startsWith('Hotels')) return 'Hotel';
  if (summary.startsWith('Route')) return 'Transporte';
  if (summary.startsWith('Car')) return 'Coche';
  if (summary.startsWith('Pro Service') || summary.startsWith('Pro monthly')) return 'Pro Service';
  if (summary.startsWith('FlexiTravel')) return 'FlexiTravel';
  return 'Otros';
}

function badgeClass(tipo) {
  if (tipo === 'Transporte') return 'badge-route';
  if (tipo === 'Hotel') return 'badge-hotel';
  if (tipo === 'Pro Service') return 'badge-pro';
  return 'badge-other';
}

function groupBy(data, key) {
  return data.reduce((acc, row) => {
    const k = row[key] || 'Sin datos';
    acc[k] = (acc[k] || 0) + parseFloat(row['TOTAL'] || 0);
    return acc;
  }, {});
}

function topN(obj, n) {
  return Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0,n);
}

let chartInstances = {};
function destroyChart(id) { if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; } }

function renderDashboard(data) {
  const total = data.reduce((s, r) => s + parseFloat(r['TOTAL'] || 0), 0);
  const viajes = data.length;
  const empleados = new Set(data.map(r => r['EMPLOYEE'])).size;
  const avgViaje = viajes > 0 ? total / viajes : 0;

  const byMes = groupBy(data, 'MES');
  const byBU = groupBy(data, 'BU');
  const byCruce = groupBy(data, 'CRUCE');
  const byEmp = groupBy(data, 'EMPLOYEE');
  const byTipo = {};
  data.forEach(r => {
    const t = getTipo(r['Summary']);
    byTipo[t] = (byTipo[t] || 0) + parseFloat(r['TOTAL'] || 0);
  });

  const mesesOrdenados = MONTHS_ORDER.filter(m => byMes[m] !== undefined);
  const mesesValues = mesesOrdenados.map(m => Math.round(byMes[m]));

  const topEmp = topN(byEmp, 8).filter(([k]) => k !== 'Otros [Caja Sal + Managers salon]' && k !== 'Otros [Consultores]');
  const maxEmp = topEmp.length > 0 ? topEmp[0][1] : 1;

  const buEntries = Object.entries(byBU).filter(([k]) => k && k !== 'nan').sort((a,b) => b[1]-a[1]);
  const cruceEntries = topN(byCruce, 6);

  document.getElementById('main-content').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="kpi-label">Gasto total</div><div class="kpi-value">${fmt(total)}</div><div class="kpi-sub">2026 acumulado</div></div>
      <div class="kpi"><div class="kpi-label">Nº de transacciones</div><div class="kpi-value">${viajes.toLocaleString('es-ES')}</div><div class="kpi-sub">líneas de gasto</div></div>
      <div class="kpi"><div class="kpi-label">Viajeros únicos</div><div class="kpi-value">${empleados}</div><div class="kpi-sub">empleados</div></div>
      <div class="kpi"><div class="kpi-label">Gasto medio / línea</div><div class="kpi-value">${fmtDec(avgViaje)}</div><div class="kpi-sub">por transacción</div></div>
    </div>

    <div class="charts">
      <div class="card">
        <h3>Gasto por mes</h3>
        <canvas id="chart-mes"></canvas>
      </div>
      <div class="card">
        <h3>Distribución por tipo</h3>
        <canvas id="chart-tipo"></canvas>
      </div>
    </div>

    <div class="charts-row3">
      <div class="card">
        <h3>Gasto por BU</h3>
        ${buEntries.map(([k,v]) => `
          <div class="bar-row">
            <div class="bar-label" title="${k}">${k}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/buEntries[0][1]*100)}%"></div></div>
            <div class="bar-amount">${fmt(v)}</div>
          </div>`).join('')}
      </div>
      <div class="card">
        <h3>Top viajeros</h3>
        ${topEmp.map(([k,v]) => `
          <div class="bar-row">
            <div class="bar-label" title="${k}">${k}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxEmp*100)}%; background:#8b5cf6"></div></div>
            <div class="bar-amount">${fmt(v)}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem">
      <h3>Gasto por área (cruce)</h3>
      <canvas id="chart-cruce" style="max-height:180px"></canvas>
    </div>

    <div class="card">
      <h3>Últimas transacciones</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Empleado</th><th>Descripción</th><th>BU</th><th>Mes</th><th>Tipo</th><th>Importe</th></tr></thead>
          <tbody>
            ${data.slice(0,20).map(r => {
              const tipo = getTipo(r['Summary']);
              return `<tr>
                <td>${r['EMPLOYEE'] || '-'}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r['Summary'] || '-'}</td>
                <td>${r['BU'] || '-'}</td>
                <td>${r['MES'] || '-'}</td>
                <td><span class="badge ${badgeClass(tipo)}">${tipo}</span></td>
                <td style="text-align:right">${fmtDec(parseFloat(r['TOTAL']||0))}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  destroyChart('mes'); destroyChart('tipo'); destroyChart('cruce');

  chartInstances['mes'] = new Chart(document.getElementById('chart-mes'), {
    type: 'bar',
    data: {
      labels: mesesOrdenados,
      datasets: [{ data: mesesValues, backgroundColor: '#4f7cff', borderRadius: 6, borderSkipped: false }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => fmt(v) }, grid: { color: '#f0f0ee' } }, x: { grid: { display: false } } }, responsive: true }
  });

  const tipoEntries = Object.entries(byTipo).sort((a,b) => b[1]-a[1]);
  chartInstances['tipo'] = new Chart(document.getElementById('chart-tipo'), {
    type: 'doughnut',
    data: {
      labels: tipoEntries.map(e => e[0]),
      datasets: [{ data: tipoEntries.map(e => Math.round(e[1])), backgroundColor: ['#4f7cff','#ff6b6b','#51cf66','#fcc419','#a9e34b','#74c0fc'], borderWidth: 0 }]
    },
    options: { plugins: { legend: { position: 'right', labels: { font: { size: 12 }, boxWidth: 12 } } }, responsive: true }
  });

  chartInstances['cruce'] = new Chart(document.getElementById('chart-cruce'), {
    type: 'bar',
    data: {
      labels: cruceEntries.map(e => e[0]),
      datasets: [{ data: cruceEntries.map(e => Math.round(e[1])), backgroundColor: '#f59e0b', borderRadius: 6, borderSkipped: false }]
    },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => fmt(v) }, grid: { color: '#f0f0ee' } }, y: { grid: { display: false } } }, responsive: true }
  });
}

function applyFilters() {
  const mes = document.getElementById('filter-mes').value;
  const bu = document.getElementById('filter-bu').value;
  const cruce = document.getElementById('filter-cruce').value;
  let filtered = allData;
  if (mes) filtered = filtered.filter(r => r['MES'] === mes);
  if (bu) filtered = filtered.filter(r => r['BU'] === bu);
  if (cruce) filtered = filtered.filter(r => r['CRUCE'] === cruce);
  renderDashboard(filtered);
}

function populateFilters(data) {
  const meses = MONTHS_ORDER.filter(m => data.some(r => r['MES'] === m));
  const bus = [...new Set(data.map(r => r['BU']).filter(Boolean))].sort();
  const cruces = [...new Set(data.map(r => r['CRUCE']).filter(Boolean))].sort();

  const selMes = document.getElementById('filter-mes');
  meses.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; selMes.appendChild(o); });

  const selBU = document.getElementById('filter-bu');
  bus.forEach(b => { const o = document.createElement('option'); o.value = b; o.textContent = b; selBU.appendChild(o); });

  const selCruce = document.getElementById('filter-cruce');
  cruces.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; selCruce.appendChild(o); });

  ['filter-mes','filter-bu','filter-cruce'].forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
}

Papa.parse(CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    allData = results.data;
    document.getElementById('last-update').textContent = `${allData.length} registros · Datos 2026`;
    populateFilters(allData);
    renderDashboard(allData);
  },
  error: function() {
    document.getElementById('main-content').innerHTML = '<div class="loading">⚠️ No se pudo cargar travelperk.csv — asegúrate de que está en la misma carpeta que index.html</div>';
  }
});
</script>
</body>
</html>
