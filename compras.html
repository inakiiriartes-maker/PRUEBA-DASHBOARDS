<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Compras 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e8eaf0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f2e,#16213e);border-bottom:1px solid #2a3050;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.accent-bar{width:7px;height:34px;background:#E8572A;border-radius:4px;flex-shrink:0}
h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.subtitle{font-size:11px;color:#8892b0;margin-top:2px}
.badge{background:#1e2435;border:1px solid #2a3050;color:#a0abc0;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600}
.layout{display:flex;min-height:calc(100vh - 65px)}
.sidebar{width:200px;min-width:200px;background:#141824;border-right:1px solid #222840;padding:16px 12px;overflow-y:auto}
.section-label{font-size:10px;font-weight:700;color:#E8572A;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.filter-group{margin-bottom:20px}
label.check-item{display:flex;align-items:center;gap:7px;margin-bottom:6px;cursor:pointer;font-size:11px;color:#556}
label.check-item input{accent-color:#E8572A;width:13px;height:13px;flex-shrink:0}
label.check-item.active{color:#e8eaf0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
select{width:100%;background:#1e2435;color:#e8eaf0;border:1px solid #2a3050;border-radius:6px;padding:6px 8px;font-size:11px}
.main{flex:1;padding:18px 22px;overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.kpi{background:#141824;border-radius:10px;padding:14px 18px}
.kpi-label{font-size:11px;color:#8892b0;margin-bottom:4px}
.kpi-value{font-size:24px;font-weight:800;letter-spacing:-1px}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:7px 15px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:#1e2435;color:#8892b0;transition:all .15s}
.tab.active{background:#E8572A;color:#fff}
.panel{background:#141824;border-radius:12px;padding:18px 20px;border:1px solid #222840;display:none}
.panel.active{display:block}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.panel-title{font-size:14px;font-weight:700}
.controls{display:flex;gap:8px;align-items:center}
input[type=text]{background:#0f1117;border:1px solid #2a3050;border-radius:6px;padding:5px 10px;color:#e8eaf0;font-size:12px;width:180px}
select.small{width:auto}
.chart-wrap{position:relative;width:100%}
.bar-table{width:100%;border-collapse:collapse}
.bar-table td{padding:4px 6px;font-size:12px;vertical-align:middle}
.bar-table td:first-child{color:#a0abc0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-table td:last-child{color:#E8572A;font-weight:700;text-align:right;white-space:nowrap;padding-left:12px}
.bar-bg{height:18px;background:#1e2435;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:#E8572A;transition:width .3s}
.bar-fill.teal{background:#2A9D8F}
.partial-warn{font-size:11px;color:#F4A261;background:#F4A26115;border:1px solid #F4A26130;border-radius:6px;padding:4px 10px}
.empty{color:#556;text-align:center;padding:40px}
@media(max-width:700px){.layout{flex-direction:column}.sidebar{width:100%;min-width:unset}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="accent-bar"></div>
    <div>
      <h1>Dashboard de Compras 2026</h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>
  <a href="index.html" style="background:#1e2435;border:1px solid #2a3050;color:#a0abc0;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none">&#8592; Volver al inicio</a>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="filter-group">
      <div class="section-label">Meses</div>
      <div id="month-filters"></div>
    </div>
    <div class="filter-group">
      <div class="section-label">Departamento</div>
      <div id="dept-filters"></div>
    </div>
    <div class="filter-group">
      <div class="section-label">CCO / Cuenta</div>
      <select id="cco-filter"><option value="ALL">- Todos -</option></select>
    </div>
  </div>

  <div class="main">
    <div class="kpis">
      <div class="kpi" style="border:1px solid #E8572A33">
        <div class="kpi-label">Gasto Total</div>
        <div class="kpi-value" id="kpi-total" style="color:#E8572A">-</div>
      </div>
      <div class="kpi" style="border:1px solid #2A9D8F33">
        <div class="kpi-label">Proveedores unicos</div>
        <div class="kpi-value" id="kpi-provs" style="color:#2A9D8F">-</div>
      </div>
      <div class="kpi" style="border:1px solid #F4A26133">
        <div class="kpi-label">Meses seleccionados</div>
        <div class="kpi-value" id="kpi-meses" style="color:#F4A261">-</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="setTab('proveedores')">Top Proveedores</button>
      <button class="tab" onclick="setTab('cco')">Por Cuenta (CCO)</button>
      <button class="tab" onclick="setTab('tendencia')">Tendencia Mensual</button>
    </div>

    <div class="panel active" id="panel-proveedores">
      <div class="panel-header">
        <div class="panel-title">Proveedores por Importe</div>
        <div class="controls">
          <input type="text" id="search-prov" placeholder="Buscar proveedor..." oninput="render()">
          <select class="small" id="top-n" onchange="render()">
            <option value="10">Top 10</option>
            <option value="15" selected>Top 15</option>
            <option value="20">Top 20</option>
            <option value="30">Top 30</option>
            <option value="50">Top 50</option>
          </select>
        </div>
      </div>
      <div id="prov-bars"></div>
    </div>

    <div class="panel" id="panel-cco">
      <div class="panel-header">
        <div class="panel-title">Gasto por Cuenta (CCO) - Top 20</div>
      </div>
      <div id="cco-bars"></div>
    </div>

    <div class="panel" id="panel-tendencia">
      <div class="panel-header">
        <div class="panel-title">Tendencia Mensual por Departamento</div>
        <div id="partial-warn" class="partial-warn" style="display:none"></div>
      </div>
      <div class="chart-wrap" style="height:320px">
        <canvas id="trend-chart"></canvas>
      </div>
    </div>
  </div>
</div>

const PALETTE = ["#E8572A","#F4A261","#2A9D8F","#264653","#E9C46A","#A8DADC","#457B9D","#1D3557","#6D6875","#B5838D","#52B788","#F77F00"];

let allMeses, allDepts, deptColors, activeMeses, activeDepts, trendChart = null;

function fmt(n) {
  if (!n && n !== 0) return "-";
  if (n >= 1000000) return (n/1000000).toFixed(1) + "M\u20ac";
  if (n >= 1000) return (n/1000).toFixed(1) + "K\u20ac";
  return n.toFixed(0) + "\u20ac";
}

function init() {
  allMeses = [...new Set(RAW.map(d => d.mes))].sort();
  allDepts = [...new Set(RAW.map(d => d.departamento))].sort();
  deptColors = Object.fromEntries(allDepts.map((d,i) => [d, PALETTE[i % PALETTE.length]]));
  activeMeses = new Set(allMeses);
  activeDepts = new Set(allDepts);

  // Month filters
  const mf = document.getElementById('month-filters');
  allMeses.forEach(m => {
    const partial = PARTIAL_MONTHS.includes(m);
    const lab = document.createElement('label');
    lab.className = 'check-item active';
    lab.dataset.mes = m;
    lab.innerHTML = '<input type="checkbox" checked onchange="toggleMes(\'' + m + '\')">' +
      '<span>' + (MES_LABELS[m]||m) + (partial ? ' <span style="color:#F4A261;font-size:10px">* parcial</span>' : '') + '</span>';
    mf.appendChild(lab);
  });

  // Dept filters
  const df = document.getElementById('dept-filters');
  const labAll = document.createElement('label');
  labAll.className = 'check-item active';
  labAll.innerHTML = '<input type="checkbox" id="all-depts" checked onchange="toggleAllDepts(this.checked)"><span style="font-style:italic;color:#778">Todos</span>';
  df.appendChild(labAll);
  allDepts.forEach((d, i) => {
    const lab = document.createElement('label');
    lab.className = 'check-item active';
    lab.dataset.dept = d;
    const color = PALETTE[i % PALETTE.length];
    lab.innerHTML = '<input type="checkbox" checked onchange="toggleDept(\'' + d.replace(/'/g,"\\'") + '\',this.checked)" style="accent-color:' + color + '">' +
      '<span class="dot" style="background:' + color + '"></span>' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + d + '">' + d + '</span>';
    df.appendChild(lab);
  });

  updateCcoFilter();

  document.getElementById('subtitle').textContent =
    RAW.length.toLocaleString() + ' registros \u00b7 ' + allMeses.length + ' meses';
  document.getElementById('update-badge').textContent = 'Datos: ' + allMeses.map(m => MES_LABELS[m]||m).join(', ');

  render();
}

function getFiltered() {
  const cco = document.getElementById('cco-filter').value;
  return RAW.filter(d =>
    activeMeses.has(d.mes) &&
    activeDepts.has(d.departamento) &&
    (cco === 'ALL' || d.cco === cco)
  );
}

function updateCcoFilter() {
  const sel = document.getElementById('cco-filter');
  const prev = sel.value;
  const ccos = [...new Set(RAW.filter(d => activeDepts.has(d.departamento)).map(d => d.cco))].sort();
  sel.innerHTML = '<option value="ALL">- Todos -</option>' + ccos.map(c => '<option value="' + c + '">' + c + '</option>').join('');
  if (ccos.includes(prev)) sel.value = prev;
}

function toggleMes(m) {
  activeMeses.has(m) ? activeMeses.delete(m) : activeMeses.add(m);
  document.querySelector('label[data-mes="' + m + '"]').className = 'check-item' + (activeMeses.has(m) ? ' active' : '');
  render();
}

function toggleDept(d, checked) {
  checked ? activeDepts.add(d) : activeDepts.delete(d);
  const lab = document.querySelector('label[data-dept="' + d + '"]');
  if (lab) lab.className = 'check-item' + (checked ? ' active' : '');
  document.getElementById('all-depts').checked = activeDepts.size === allDepts.length;
  updateCcoFilter();
  render();
}

function toggleAllDepts(checked) {
  allDepts.forEach(d => {
    checked ? activeDepts.add(d) : activeDepts.delete(d);
    const lab = document.querySelector('label[data-dept="' + d + '"]');
    if (lab) { lab.className = 'check-item' + (checked ? ' active' : ''); lab.querySelector('input').checked = checked; }
  });
  updateCcoFilter();
  render();
}

let activeTab = 'proveedores';
function setTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', ['proveedores','cco','tendencia'][i] === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + t).classList.add('active');
  render();
}

function makeBars(containerId, items, colorClass) {
  const el = document.getElementById(containerId);
  if (!items.length) { el.innerHTML = '<div class="empty">Sin resultados</div>'; return; }
  const max = items[0].importe;
  el.innerHTML = '<table class="bar-table">' + items.map(r => {
    const pct = max > 0 ? Math.round(r.importe / max * 100) : 0;
    const name = r.label || '';
    const full = r.fullName || name;
    return '<tr><td title="' + full + '">' + name + '</td>' +
      '<td style="width:55%"><div class="bar-bg"><div class="bar-fill ' + (colorClass||'') + '" style="width:' + pct + '%"></div></div></td>' +
      '<td>' + fmt(r.importe) + '</td></tr>';
  }).join('') + '</table>';
}

function render() {
  const filtered = getFiltered();
  const total = filtered.reduce((a, d) => a + d.importe, 0);
  const provs = new Set(filtered.map(d => d.proveedor)).size;
  document.getElementById('kpi-total').textContent = fmt(total);
  document.getElementById('kpi-provs').textContent = provs.toLocaleString();
  document.getElementById('kpi-meses').textContent = activeMeses.size + ' / ' + allMeses.length;

  if (activeTab === 'proveedores') {
    const search = (document.getElementById('search-prov').value || '').toLowerCase();
    const topN = parseInt(document.getElementById('top-n').value) || 15;
    const map = {};
    filtered.forEach(d => { map[d.proveedor] = (map[d.proveedor] || 0) + d.importe; });
    const items = Object.entries(map)
      .map(([p, i]) => ({ label: p.length > 34 ? p.slice(0,32) + '...' : p, fullName: p, importe: Math.round(i*100)/100 }))
      .filter(r => r.fullName.toLowerCase().includes(search))
      .sort((a, b) => b.importe - a.importe).slice(0, topN);
    makeBars('prov-bars', items, '');
  }

  if (activeTab === 'cco') {
    const map = {};
    filtered.forEach(d => { map[d.cco] = (map[d.cco] || 0) + d.importe; });
    const items = Object.entries(map)
      .map(([c, i]) => ({ label: c.length > 30 ? c.slice(0,28) + '...' : c, fullName: c, importe: Math.round(i*100)/100 }))
      .sort((a, b) => b.importe - a.importe).slice(0, 20);
    makeBars('cco-bars', items, 'teal');
  }

  if (activeTab === 'tendencia') {
    const visibleDepts = allDepts.filter(d => activeDepts.has(d));
    const visibleMeses = [...activeMeses].sort();
    const partialVisible = PARTIAL_MONTHS.filter(m => activeMeses.has(m));
    const warn = document.getElementById('partial-warn');
    if (partialVisible.length) {
      warn.style.display = '';
      warn.textContent = '* ' + partialVisible.map(m => MES_LABELS[m]||m).join(', ') + ' con datos parciales';
    } else { warn.style.display = 'none'; }

    const ccoVal = document.getElementById('cco-filter').value;
    const datasets = visibleDepts.map((dept, i) => {
      const color = deptColors[dept];
      return {
        label: dept,
        data: visibleMeses.map(m =>
          RAW.filter(d => d.mes === m && d.departamento === dept && (ccoVal === 'ALL' || d.cco === ccoVal))
            .reduce((a, d) => a + d.importe, 0)
        ),
        borderColor: color,
        backgroundColor: color + '33',
        tension: 0.3,
        pointRadius: 4,
        pointHoverRadius: 6,
        borderWidth: 2
      };
    });

    if (trendChart) trendChart.destroy();
    trendChart = new Chart(document.getElementById('trend-chart'), {
      type: 'line',
      data: { labels: visibleMeses.map(m => MES_LABELS[m]||m), datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#a0abc0', font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmt(ctx.parsed.y) } }
        },
        scales: {
          x: { ticks: { color: '#8892b0' }, grid: { color: '#1e2435' } },
          y: { ticks: { color: '#556', callback: v => fmt(v) }, grid: { color: '#1e2435' } }
        }
      }
    });
  }
}

document.getElementById('cco-filter').addEventListener('change', render);
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
